port = 5600
# aw-tauri already discovers paths relative to the current user's home:
# ~/bin, ~/.local/bin, ~/.local/share/activitywatch/aw-tauri/modules,
# ~/aw-modules, and $PATH.
discovery_paths = []

[autostart]
enabled = true
minimized = true
modules = ["aw-awatcher"]

[module_args]
"aw-awatcher" = ""
